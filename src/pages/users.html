<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen User - 5R Assessment</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        @@include('../components/sidebar.html', {"active": "users"})

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div>
                    <h1>Manajemen User</h1>
                    <p>Kelola Pengguna & Hak Akses</p>
                </div>
                <div id="userInfo"></div>
            </header>

            <div class="card">
                <div class="card-header">
                    <h2>Daftar User</h2>
                    <div class="card-actions">
                        <button class="btn btn-primary" onclick="openUserModal()">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M12 5v14M5 12h14" />
                            </svg>
                            Tambah User
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Nama Lengkap</th>
                                    <th>Username</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="usersTable">
                                <!-- User list will be injected here -->
                            </tbody>
                        </table>
                        <div id="emptyUsers" class="empty-state" style="display: none;">
                            <p>Belum ada user terdaftar (selain default).</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- User Modal (Create/Edit) -->
    <div id="userModal" class="modal">
        <div class="modal-overlay" onclick="closeUserModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Tambah User Baru</h3>
                <button class="btn-close" onclick="closeUserModal()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="userForm" onsubmit="handleUserSubmit(event)">
                    <input type="hidden" id="userId">
                    <div class="form-group mb-4" style="margin-bottom: 1rem;">
                        <label>Nama Lengkap <span class="required">*</span></label>
                        <input type="text" id="userName" required>
                    </div>
                    <div class="form-group mb-4" style="margin-bottom: 1rem;">
                        <label>Username <span class="required">*</span></label>
                        <input type="text" id="userUsername" required>
                    </div>
                    <div class="form-group mb-4" style="margin-bottom: 1rem;">
                        <label>Email</label>
                        <input type="email" id="userEmail" placeholder="contoh@email.com">
                    </div>
                    <div class="form-group mb-4" style="margin-bottom: 1rem;">
                        <label>Password <span id="passwordRequired" class="required">*</span>
                            <span id="passwordHint"
                                style="font-weight:normal; font-size: 0.75rem; display:none;">(Kosongkan jika tidak ingin
                                diubah)</span></label>
                        <div class="password-wrapper">
                            <input type="password" id="userPassword" placeholder="Masukkan password"
                                oninput="validatePassword(this.value)">
                            <button type="button" class="password-toggle"
                                onclick="togglePasswordVisibility('userPassword', this)" title="Lihat Password">
                                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                        <!-- Password Strength Indicator -->
                        <div id="passwordStrength" style="margin-top: 0.5rem; display: none;">
                            <div class="strength-bar">
                                <div class="strength-fill" id="strengthFill"></div>
                            </div>
                            <span id="strengthText" style="font-size: 0.75rem;"></span>
                        </div>
                        <!-- Password Requirements -->
                        <div id="passwordRequirements" style="margin-top: 0.5rem; font-size: 0.75rem; color: #6b7280;">
                            <div id="req-min" class="req-item">
                                <span class="req-icon">○</span> Minimal 6 karakter
                            </div>
                            <div id="req-upper" class="req-item">
                                <span class="req-icon">○</span> Minimal 1 huruf besar
                            </div>
                            <div id="req-number" class="req-item">
                                <span class="req-icon">○</span> Minimal 1 angka
                            </div>
                        </div>
                        <div id="passwordError" class="error-message" style="color: #dc2626; font-size: 0.75rem; margin-top: 0.25rem; display: none;"></div>
                    </div>
                    <div class="form-group mb-4" style="margin-bottom: 1rem;">
                        <label>Role <span class="required">*</span></label>
                        <select id="userRole" required>
                            <option value="user">User</option>
                            <option value="k3">K3 Admin</option>
                        </select>
                    </div>
                    <div class="form-actions" style="margin-top: 2rem;">
                        <button type="button" class="btn btn-secondary" onclick="closeUserModal()">Batal</button>
                        <button type="submit" class="btn btn-primary" id="saveUserBtn">Simpan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">
        <div class="toast-content">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="toastMessage">Berhasil!</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/script.js"></script>
    <script src="assets/js/users.js"></script>
</body>

</html>
