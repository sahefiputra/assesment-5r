<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self Assessment 5R - Dashboard</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>

<body>
    <div class="app-container">
        @@include('../components/sidebar.html', {"active": "dashboard"})

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div>
                    <h1>Dashboard</h1>
                    <p>Self Assessment 5R Divisi</p>
                </div>
                <div id="userInfo"></div>
            </header>

            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card stat-primary">
                    <div class="stat-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path
                                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                    </div>
                    <div class="stat-content">
                        <span class="stat-value" id="statTotal">0</span>
                        <span class="stat-label">Total Assessment</span>
                    </div>
                </div>
                <div class="stat-card stat-info">
                    <div class="stat-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path
                                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </div>
                    <div class="stat-content">
                        <span class="stat-value" id="statDivisi">0</span>
                        <span class="stat-label">Divisi Terdaftar</span>
                    </div>
                </div>
            </div>

            <!-- Assessment List -->
            <div class="card">
                <div class="card-header">
                    <h2>Daftar Assessment</h2>
                    <div class="card-actions">
                        <div class="search-box">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <circle cx="11" cy="11" r="8" />
                                <path d="M21 21l-4.35-4.35" />
                            </svg>
                            <input type="text" id="searchInput" placeholder="Cari assessment...">
                        </div>
                        <button class="btn btn-success k3-only" onclick="exportToExcel()" style="display: none;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            Export Excel
                        </button>
                        <button class="btn btn-primary" onclick="window.location.href='form.html'">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M12 5v14M5 12h14" />
                            </svg>
                            Buat Assessment Baru
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Nama Karyawan</th>
                                    <th>Divisi</th>
                                    <th>Jabatan</th>
                                    <th>Tanggal Isi</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="assessmentTable">
                                <!-- Data akan diisi via JavaScript -->
                            </tbody>
                        </table>
                        <div id="emptyState" class="empty-state" style="display: none;">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="1.5">
                                <path
                                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                            <p>Belum ada assessment yang dibuat</p>
                            <button class="btn btn-primary" onclick="window.location.href='form.html'">
                                Buat Assessment Pertama
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Detail -->
    <div id="detailModal" class="modal">
        <div class="modal-overlay" onclick="closeModal()"></div>
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3>Detail Assessment</h3>
                <button class="btn-close" onclick="closeModal()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Content akan diisi via JavaScript -->
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <div class="toast-content">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 13l4 4L19 7" />
            </svg>
            <span id="toastMessage">Data berhasil disimpan</span>
        </div>
    </div>
    <!-- Modal Verifikasi K3 -->
    <div id="k3VerifModal" class="modal">
        <div class="modal-overlay" onclick="closeK3VerifModal()"></div>
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3>Verifikasi K3</h3>
                <button class="btn-close" onclick="closeK3VerifModal()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="modal-body" id="k3VerifModalBody">
                <!-- Content akan diisi via JavaScript -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeK3VerifModal()">Batal</button>
                <button type="button" class="btn btn-primary" onclick="submitK3Verification()">Simpan
                    Verifikasi</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/script.js"></script>
</body>

</html>
